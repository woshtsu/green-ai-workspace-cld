# Integración continua: pruebas por servicio en cada push/PR a test y main. No despliega nada.
name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: software/frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: '22' }
      - run: node --test tests/*.test.cjs

  prediction:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: software/prediction } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: software/prediction/requirements.lock.txt }
      - run: pip install -r requirements.lock.txt
      - run: python scripts/run_pipeline.py --skip-mlflow
      - run: pytest -q

  data-processing:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: software/data-processing } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: '3.14' }
      - run: pip install -r requirements.txt
      - run: pytest -q

  gateway-go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: software/gateway-go } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with: { go-version-file: software/gateway-go/go.mod }
      - run: go vet ./...
      - run: go test -race ./...

  monitoring:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: software/monitoring } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -q -B verify

  imagenes-docker:
    # Comprueba que el Compose es válido y que las imágenes de despliegue construyen (sin publicarlas).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: touch software/frontend/config.local.js
      - run: docker compose -f software/infraestructura/docker-compose.yml config --quiet
      - run: docker build -t gai-prediction software/prediction
      - run: docker build -t gai-gateway-go -f software/gateway-go/Dockerfile software
      - run: docker build -t gai-data-processing software/data-processing

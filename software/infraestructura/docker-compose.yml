# Green AI — ejecución local del monorepo.
# Uso (desde la raíz del monorepo):
#   docker compose -f software/infraestructura/docker-compose.yml config   # validar
#   docker compose -f software/infraestructura/docker-compose.yml up -d --build
# Proyecto y puertos distintos del workspace antiguo (que usa 8000/8080/8081/9090/3001),
# para poder ejecutar ambos a la vez durante la transición.
name: green-ai-mono

services:
  simulator:
    build:
      context: ../simulator
    ports:
      - "127.0.0.1:${MONO_SIMULATOR_PORT:-18000}:8000"
    command: >
      run
      --inventory ${SIMULATOR_INVENTORY:-configs/inventory.hardware.json}
      --scenario ${SIMULATOR_SCENARIO:-configs/scenarios/normal.json}
      --seed 42
      --duration-seconds ${SIMULATOR_DURATION_SECONDS:-86400}
      --tick-seconds 5
      --mode realtime
      --output-dir runs
      --host 0.0.0.0
      --port 8000

  # Prometheus es un servicio externo al proceso Java de Monitoring.
  prometheus:
    image: prom/prometheus:v3.13.3
    ports:
      - "127.0.0.1:${MONO_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - simulator

  monitoring:
    build:
      context: ../monitoring
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MONO_MONITORING_PORT:-18080}:8080"
    environment:
      - MONITORING_PROMETHEUS_URL=http://prometheus:9090
      - MONITORING_PROMETHEUS_DEFAULT_CLUSTER=sim-lab
      - MONITORING_PROMETHEUS_INSTANCE_LABEL=node
    depends_on:
      - prometheus

  data-processing:
    build: ../data-processing
    env_file:
      - path: ../data-processing/.env
        required: false
    environment:
      MONITORING_BASE_URL: http://monitoring:8080
      REQUEST_TIMEOUT_SECONDS: "10"
    expose:
      - "8000"
    depends_on:
      - monitoring

  # Prediction incluye recomendaciones (no hay microservicio Recommendations separado).
  prediction:
    build: ../prediction
    environment:
      DEMO_POLICY_JSON: '${DEMO_POLICY_JSON:-{}}'
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MONO_GATEWAY_PORT:-18081}:8081"
    environment:
      - GATEWAY_MONITORING_BASE_URL=http://monitoring:8080
      - GATEWAY_DATA_PROCESSING_BASE_URL=http://data-processing:8000
      - GATEWAY_PREDICTION_BASE_URL=http://prediction:8000
      # Proyecto Supabase (datos públicos de emisor/JWKS, no secretos). Sobrescribir por entorno.
      - GATEWAY_AUTH_ISSUER_URI=${GATEWAY_AUTH_ISSUER_URI:-https://jpfugpsdhuucmilgysgg.supabase.co/auth/v1}
      - GATEWAY_AUTH_JWK_SET_URI=${GATEWAY_AUTH_JWK_SET_URI:-https://jpfugpsdhuucmilgysgg.supabase.co/auth/v1/.well-known/jwks.json}
      # Debe coincidir exactamente con la URL usada para abrir el Frontend.
      - GATEWAY_CORS_ALLOWED_ORIGIN=${GATEWAY_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:13001}
    depends_on:
      - monitoring
      - data-processing
      - prediction

  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:${MONO_FRONTEND_PORT:-13001}:3001"
    volumes:
      # Crear desde software/frontend/config.example.js (gatewayBaseUrl http://127.0.0.1:18081).
      - type: bind
        source: ../frontend/config.local.js
        target: /usr/share/nginx/html/config.local.js
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - gateway

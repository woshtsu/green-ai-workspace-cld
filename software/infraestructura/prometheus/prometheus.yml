global:
  scrape_interval: 5s # Leerá los datos del simulador cada 5 segundos

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'green-ai-prediction'
    static_configs:
      - targets: ['prediction:8000']
  - job_name: 'green-ai-simulator'
    static_configs:
      # Apunta al nombre del contenedor del simulador en la red de Docker
      - targets: ['simulator:8000']

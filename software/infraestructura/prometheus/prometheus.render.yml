# Prometheus para Render (plan gratuito, sin red privada): scrape por HTTPS público.
# Los hosts son los de los servicios *-dev de Render; ajustarlos si cambian las URLs.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'green-ai-prediction'
    # 60 s: Render limita (HTTP 429) las llamadas entre servicios por URL pública; la CPU de los nodos
    # viene del simulador (15 s). Las alertas sobre Prediction usan ventanas >= 2 min.
    scrape_interval: 60s
    scrape_timeout: 20s
    scheme: https
    static_configs:
      - targets: ['green-ai-prediction-dev-zxly.onrender.com:443']
  - job_name: 'green-ai-simulator'
    scheme: https
    static_configs:
      - targets: ['green-ai-simulator-dev.onrender.com:443']
